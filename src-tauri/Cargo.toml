[package]
name = "life"
version = "0.2.0"
description = "Dashboard da vida: saúde, alimentação, faculdade, cursos e finanças"
authors = ["Guilherme"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# O Tauri gera a biblioteca e o binário a partir do mesmo código: o `_lib` evita
# o conflito de nome com o executável no Windows.
name = "life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# `sqlite` é a única feature ligada: sem ela o plugin arrastaria os drivers de
# Postgres e MySQL para dentro do instalador sem nenhum uso.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# O instalador é baixado e guardado por uma pessoa só; tamanho importa mais do
# que tempo de compilação.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
