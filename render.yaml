# Deploy no Render como Static Site.
# O banco fica no Supabase; não há serviço de backend nesta fase.
services:
  - type: web
    name: life
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Defina os valores no painel do Render (Environment).
      # A anon key é pública por design — quem protege os dados é o RLS.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # SPA: qualquer rota cai no index.html e o React Router resolve.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
