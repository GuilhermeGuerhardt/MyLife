<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <!-- O iOS ignora o manifest; é por estas duas que ele abre em tela cheia. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life" />
    <title>Life</title>
    <script>
      // Aplica o tema antes do primeiro paint para não piscar branco. A tabela
      // é uma cópia enxuta de src/lib/theme.ts: este trecho roda antes do
      // pacote, então não dá para importar de lá.
      (() => {
        const TEMAS = {
          dark: ['dark', '#1a1a1d'],
          dim: ['dark', '#33353d'],
          light: ['light', '#fafafa'],
          dracula: ['dark', '#282a36'],
          nord: ['dark', '#2e3440'],
          solar: ['light', '#fdf6e3'],
        }
        let escolhido = 'dark'
        try {
          const guardado = localStorage.getItem('life:theme')
          if (guardado && TEMAS[guardado]) escolhido = guardado
        } catch {
          // Armazenamento bloqueado: vale o padrão.
        }
        const [esquema, cor] = TEMAS[escolhido]
        document.documentElement.dataset.theme = escolhido
        document.documentElement.dataset.scheme = esquema
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', cor)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
